name: "Swarm image"

# Builds the root Dockerfile for linux/amd64 and pushes it to the GitHub container registry.
# It runs only when started by hand, so no push or tag starts it. Upstream's release.yml beside it, which
# starts on any pushed tag that matches v6*, is disabled in this repository's Actions settings.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag, for example 6.0-r2-swarm.1"
        required: true
        type: string

permissions:
  contents: read
  packages: write
  actions: read

jobs:
  image:
    name: image
    runs-on: ubuntu-22.04
    env:
      IMAGE: ghcr.io/solar-punk-ltd/swarm-srs
      SOURCE_URL: https://github.com/${{ github.repository }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      # The Dockerfile runs no tests, so an image is built only from a commit whose Test run has passed.
      - name: Require a passing Test run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow Test --commit "$GITHUB_SHA" \
            --status completed --limit 1 --json conclusion --jq '.[0].conclusion')
          if [ "$conclusion" != "success" ]; then
            echo "Test has not passed for $GITHUB_SHA (latest completed run: ${conclusion:-none})" && exit 1
          fi
      - name: Check the tag
        run: |
          if [[ ! $INPUT_TAG =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Not a valid image tag: $INPUT_TAG" && exit 1
          fi
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> $GITHUB_ENV
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
      - name: Login to the GitHub container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same configure flags as the official release in release.yml. The Dockerfile copies ffmpeg out of
      # the build image, so pinning that image's index by digest keeps ffmpeg the same on every build.
      - name: Build and push the image
        run: |
          docker buildx build --platform linux/amd64 \
            --output "type=image,push=true" \
            --metadata-file metadata.json \
            -t $IMAGE:$INPUT_TAG -t $IMAGE:sha-$SHORT_SHA \
            --label org.opencontainers.image.source=$SOURCE_URL \
            --label org.opencontainers.image.revision=$GITHUB_SHA \
            --annotation "index,manifest:org.opencontainers.image.source=$SOURCE_URL" \
            --build-arg IMAGE=ossrs/srs:ubuntu20@sha256:5abc49d6f80ecbca6a60b0d6e605ecc93d13768903966ae7b912d1add6a9fc4e \
            --build-arg CONFARGS='--sanitizer=off --gb28181=on' \
            -f Dockerfile .
      - name: Write the digest to the summary
        run: |
          DIGEST=$(jq -r '."containerimage.digest"' metadata.json)
          echo "Pushed $IMAGE:$INPUT_TAG and $IMAGE:sha-$SHORT_SHA" >> $GITHUB_STEP_SUMMARY
          echo "Digest $DIGEST" >> $GITHUB_STEP_SUMMARY
          echo "Commit $GITHUB_SHA" >> $GITHUB_STEP_SUMMARY
